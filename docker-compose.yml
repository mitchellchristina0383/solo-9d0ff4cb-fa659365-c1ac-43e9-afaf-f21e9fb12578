services:
  symbol-server:
    build: .
    image: crash-symbol-server:latest
    container_name: crash-symbol-server
    ports:
      - "8000:8000"
    volumes:
      - symbol-data:/data
    environment:
      SYMBOL_DATA_DIR: /data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  symbol-data:
